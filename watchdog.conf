# zoom-edl-watchdog configuration
# Install to: /opt/zoom-edl-watchdog/watchdog.conf

# Full URL of the GitHub Pages-hosted EDL file
EDL_URL="https://YOUR-ORG.github.io/zoom-edl/zoom-edl.txt"

# Alert if the EDL content hasn't changed in this many hours
# GitHub Actions runs every 6h, so 8h gives a reasonable buffer
STALE_HOURS=8

# Alert if the entry count drops by more than this percentage
# Protects against Zoom changing their JSON schema silently
DROP_PCT=20

# Minimum seconds between repeat alerts for the same condition (6 hours)
REALERT_SECS=21600
